<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OG 画像ジェネレータ - public-tools</title>
<link rel="stylesheet" href="../_shared/style.css">
<style>
  /* tool-local: 入力フォームとプレビュー */
  .form-grid {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 10px 14px;
    align-items: center;
    padding: 12px 14px;
  }
  .form-grid > label {
    color: var(--muted);
    font-size: 0.9rem;
  }
  .form-grid .inline {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
  }
  .form-grid .inline input[type="color"] { padding: 0; height: 28px; width: 50px; border-radius: 4px; }
  .form-grid input[type="number"] { max-width: 120px; }
  .form-grid input[type="range"] { width: 220px; vertical-align: middle; }
  .form-grid select.short { max-width: 220px; }
  .form-grid label.toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.92rem;
    cursor: pointer;
    color: var(--fg);
  }
  .form-grid label.toggle input[type="checkbox"] { width: auto; margin: 0; }

  .canvas-wrap {
    margin-top: 12px;
    background: repeating-conic-gradient(#f3f4f6 0 25%, #fff 0 50%) 0 0 / 16px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    display: flex;
    justify-content: center;
  }
  .canvas-wrap canvas {
    max-width: 100%;
    height: auto;
    display: block;
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.15);
    border-radius: 6px;
  }

  .preset-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 4px 14px 12px;
  }
  .preset-row button {
    padding: 5px 12px;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="container wide">
  <div class="nav"><a href="../../index.html">← ツール一覧へ戻る</a></div>
  <header class="page-header">
    <h1>OG 画像ジェネレータ</h1>
    <p class="lead">タイトル・サブタイトル・背景色・グラデーションから、シェア用 OGP 画像 (1200×630 等) を Canvas で生成します。</p>
  </header>

  <h2>サイズ・余白</h2>
  <div class="card form-grid">
    <label>キャンバスサイズ</label>
    <div class="inline">
      <select id="size" class="short">
        <option value="1200x630" selected>OGP 標準 1200 × 630</option>
        <option value="1080x1080">Instagram 正方形 1080 × 1080</option>
        <option value="1500x500">X / Twitter ヘッダ 1500 × 500</option>
        <option value="800x420">小さめ 800 × 420</option>
        <option value="custom">カスタム</option>
      </select>
      <span style="color:var(--muted);font-size:0.85rem;">幅</span>
      <input type="number" id="width" value="1200" min="100" max="4000" step="10">
      <span style="color:var(--muted);font-size:0.85rem;">高さ</span>
      <input type="number" id="height" value="630" min="100" max="4000" step="10">
    </div>

    <label>余白 (px)</label>
    <div class="inline">
      <input type="range" id="padding" min="0" max="200" value="80">
      <span id="paddingVal" style="color:var(--muted);font-size:0.85rem;">80</span>
    </div>
  </div>

  <h2>背景</h2>
  <div class="card form-grid">
    <label>種類</label>
    <div class="inline">
      <label class="toggle"><input type="radio" name="bgType" value="solid" checked>単色</label>
      <label class="toggle"><input type="radio" name="bgType" value="linear">直線グラデ</label>
      <label class="toggle"><input type="radio" name="bgType" value="radial">放射グラデ</label>
    </div>

    <label>色 1</label>
    <div class="inline">
      <input type="color" id="bg1" value="#1d4ed8">
      <input type="text" id="bg1Hex" value="#1d4ed8" style="max-width:120px;">
    </div>

    <label>色 2</label>
    <div class="inline">
      <input type="color" id="bg2" value="#7c3aed">
      <input type="text" id="bg2Hex" value="#7c3aed" style="max-width:120px;">
      <span style="color:var(--muted);font-size:0.8rem;">（グラデーション時のみ）</span>
    </div>

    <label>角度 (deg)</label>
    <div class="inline">
      <input type="range" id="angle" min="0" max="360" value="135">
      <span id="angleVal" style="color:var(--muted);font-size:0.85rem;">135°</span>
      <span style="color:var(--muted);font-size:0.8rem;">（直線グラデのみ）</span>
    </div>

    <span></span>
    <div class="preset-row" style="padding-left:0;">
      <button type="button" data-preset='{"type":"linear","c1":"#1d4ed8","c2":"#7c3aed","angle":135}'>青→紫</button>
      <button type="button" data-preset='{"type":"linear","c1":"#0f766e","c2":"#16a34a","angle":135}'>緑系</button>
      <button type="button" data-preset='{"type":"linear","c1":"#dc2626","c2":"#f59e0b","angle":135}'>赤→橙</button>
      <button type="button" data-preset='{"type":"linear","c1":"#0f172a","c2":"#1e3a8a","angle":120}'>暗めの青</button>
      <button type="button" data-preset='{"type":"radial","c1":"#fef3c7","c2":"#fb923c","angle":0}'>朝焼け</button>
      <button type="button" data-preset='{"type":"solid","c1":"#ffffff","c2":"#ffffff","angle":0}'>白</button>
      <button type="button" data-preset='{"type":"solid","c1":"#0f172a","c2":"#0f172a","angle":0}'>黒</button>
    </div>
  </div>

  <h2>タイトル</h2>
  <div class="card form-grid">
    <label>タイトル</label>
    <input type="text" id="title" value="ブラウザだけで動く便利ツール集" maxlength="200">

    <label>サブタイトル</label>
    <input type="text" id="subtitle" value="public-tools" maxlength="120">

    <label>サイト名 (任意)</label>
    <input type="text" id="site" value="" maxlength="120">

    <label>位置</label>
    <div class="inline">
      <select id="halign" class="short">
        <option value="left">左寄せ</option>
        <option value="center" selected>中央</option>
        <option value="right">右寄せ</option>
      </select>
      <select id="valign" class="short">
        <option value="top">上寄せ</option>
        <option value="middle" selected>中央</option>
        <option value="bottom">下寄せ</option>
      </select>
    </div>

    <label>タイトルサイズ</label>
    <div class="inline">
      <input type="range" id="titleSize" min="24" max="180" value="84">
      <span id="titleSizeVal" style="color:var(--muted);font-size:0.85rem;">84px</span>
    </div>

    <label>サブタイトルサイズ</label>
    <div class="inline">
      <input type="range" id="subSize" min="14" max="80" value="32">
      <span id="subSizeVal" style="color:var(--muted);font-size:0.85rem;">32px</span>
    </div>

    <label>文字色</label>
    <div class="inline">
      <input type="color" id="fg" value="#ffffff">
      <input type="text" id="fgHex" value="#ffffff" style="max-width:120px;">
      <button type="button" id="autoFg">背景に応じて自動</button>
    </div>

    <label>太さ</label>
    <div class="inline">
      <select id="weight" class="short">
        <option value="400">標準</option>
        <option value="600">セミボールド</option>
        <option value="700" selected>太字</option>
        <option value="900">極太</option>
      </select>
    </div>

    <label>その他</label>
    <div class="inline">
      <label class="toggle"><input type="checkbox" id="shadow" checked>文字に影</label>
      <label class="toggle"><input type="checkbox" id="border">枠線を描く</label>
      <label class="toggle"><input type="checkbox" id="dot">背景にドット</label>
    </div>
  </div>

  <h2>プレビュー</h2>
  <div class="canvas-wrap">
    <canvas id="canvas" width="1200" height="630"></canvas>
  </div>

  <div class="actions" style="margin-top:12px;">
    <button type="button" id="downloadPng" class="primary">PNG ダウンロード</button>
    <button type="button" id="downloadJpeg">JPEG ダウンロード</button>
    <button type="button" id="copyImg">画像をコピー</button>
    <span id="status" style="color:var(--muted);font-size:0.85rem;align-self:center;"></span>
  </div>

  <p style="color:var(--muted);font-size:0.85rem;margin-top:24px;">
    すべてブラウザ上で生成され、外部送信は行いません。タイトルは自動で改行され、はみ出る場合は最後を「…」で省略します。
  </p>
</div>

<script>
  (function () {
    const $ = (id) => document.getElementById(id);

    const canvas = $('canvas');
    const ctx = canvas.getContext('2d');

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function syncHex(colorId, hexId) {
      $(colorId).addEventListener('input', () => {
        $(hexId).value = $(colorId).value;
        render();
      });
      $(hexId).addEventListener('input', () => {
        const v = $(hexId).value.trim();
        if (/^#[0-9a-fA-F]{6}$/.test(v)) {
          $(colorId).value = v;
          render();
        }
      });
    }
    syncHex('bg1', 'bg1Hex');
    syncHex('bg2', 'bg2Hex');
    syncHex('fg', 'fgHex');

    function applySize() {
      const v = $('size').value;
      if (v === 'custom') return;
      const [w, h] = v.split('x').map(Number);
      $('width').value = w;
      $('height').value = h;
    }
    $('size').addEventListener('change', () => { applySize(); render(); });

    function applyPreset(p) {
      document.querySelectorAll('input[name="bgType"]').forEach((r) => {
        r.checked = (r.value === p.type);
      });
      $('bg1').value = p.c1; $('bg1Hex').value = p.c1;
      $('bg2').value = p.c2; $('bg2Hex').value = p.c2;
      $('angle').value = p.angle;
      $('angleVal').textContent = p.angle + '°';
      autoFg();
    }
    document.querySelectorAll('button[data-preset]').forEach((b) => {
      b.addEventListener('click', () => {
        applyPreset(JSON.parse(b.dataset.preset));
        render();
      });
    });

    function hexToRgb(hex) {
      const m = /^#?([0-9a-f]{6})$/i.exec(hex);
      if (!m) return { r: 0, g: 0, b: 0 };
      const n = parseInt(m[1], 16);
      return { r: (n >> 16) & 0xff, g: (n >> 8) & 0xff, b: n & 0xff };
    }
    function luminance(hex) {
      const { r, g, b } = hexToRgb(hex);
      const norm = (v) => {
        v /= 255;
        return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      };
      return 0.2126 * norm(r) + 0.7152 * norm(g) + 0.0722 * norm(b);
    }
    function autoFg() {
      const bgType = currentBgType();
      const c1 = $('bg1Hex').value;
      const c2 = $('bg2Hex').value;
      const lum = bgType === 'solid' ? luminance(c1) : (luminance(c1) + luminance(c2)) / 2;
      const color = lum > 0.5 ? '#0f172a' : '#ffffff';
      $('fg').value = color; $('fgHex').value = color;
    }
    $('autoFg').addEventListener('click', () => { autoFg(); render(); });

    function currentBgType() {
      const r = document.querySelector('input[name="bgType"]:checked');
      return r ? r.value : 'solid';
    }

    // Range live label
    function bindRange(id, valId, suffix) {
      $(id).addEventListener('input', () => {
        $(valId).textContent = $(id).value + (suffix || '');
        render();
      });
    }
    bindRange('padding', 'paddingVal', '');
    bindRange('angle', 'angleVal', '°');
    bindRange('titleSize', 'titleSizeVal', 'px');
    bindRange('subSize', 'subSizeVal', 'px');

    // Reactive form bindings
    [
      'width', 'height', 'title', 'subtitle', 'site',
      'halign', 'valign', 'weight', 'shadow', 'border', 'dot',
    ].forEach((id) => {
      $(id).addEventListener('input', render);
      $(id).addEventListener('change', render);
    });
    document.querySelectorAll('input[name="bgType"]').forEach((r) => r.addEventListener('change', render));

    // Wrap text into lines that fit maxWidth, return lines (truncated with …)
    function wrapText(text, maxWidth, fontSize, weight) {
      ctx.font = weight + ' ' + fontSize + 'px ' +
        '-apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif';
      const lines = [];
      const paragraphs = text.split(/\n+/);
      for (const p of paragraphs) {
        if (p.length === 0) { lines.push(''); continue; }
        // greedy wrap by char (works for both CJK and latin)
        let current = '';
        for (const ch of p) {
          const next = current + ch;
          if (ctx.measureText(next).width > maxWidth && current.length > 0) {
            lines.push(current);
            current = ch;
          } else {
            current = next;
          }
        }
        if (current.length > 0) lines.push(current);
      }
      return lines;
    }

    function ellipsizeLine(line, maxWidth) {
      if (ctx.measureText(line).width <= maxWidth) return line;
      const ell = '…';
      let lo = 0, hi = line.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        const trial = line.slice(0, mid) + ell;
        if (ctx.measureText(trial).width <= maxWidth) lo = mid + 1;
        else hi = mid;
      }
      return line.slice(0, Math.max(0, lo - 1)) + ell;
    }

    function paintBackground(w, h) {
      const type = currentBgType();
      const c1 = $('bg1Hex').value;
      const c2 = $('bg2Hex').value;
      if (type === 'solid') {
        ctx.fillStyle = c1;
        ctx.fillRect(0, 0, w, h);
      } else if (type === 'linear') {
        const angle = (parseFloat($('angle').value) || 0) * Math.PI / 180;
        const cx = w / 2, cy = h / 2;
        const r = Math.sqrt(w * w + h * h) / 2;
        const dx = Math.cos(angle - Math.PI / 2) * r;
        const dy = Math.sin(angle - Math.PI / 2) * r;
        const grad = ctx.createLinearGradient(cx - dx, cy - dy, cx + dx, cy + dy);
        grad.addColorStop(0, c1);
        grad.addColorStop(1, c2);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      } else if (type === 'radial') {
        const grad = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) / 1.4);
        grad.addColorStop(0, c1);
        grad.addColorStop(1, c2);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      }

      if ($('dot').checked) {
        ctx.save();
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        const step = Math.max(20, Math.floor(Math.min(w, h) / 40));
        for (let y = step / 2; y < h; y += step) {
          for (let x = step / 2; x < w; x += step) {
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();
      }

      if ($('border').checked) {
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 6;
        const m = 24;
        ctx.strokeRect(m, m, w - m * 2, h - m * 2);
      }
    }

    function render() {
      const w = clamp(parseInt($('width').value, 10) || 1200, 100, 4000);
      const h = clamp(parseInt($('height').value, 10) || 630, 100, 4000);
      canvas.width = w;
      canvas.height = h;
      // CSS preview width: scale down to fit container
      const maxCss = 800;
      const scale = Math.min(1, maxCss / w);
      canvas.style.width = (w * scale) + 'px';
      canvas.style.height = (h * scale) + 'px';

      paintBackground(w, h);

      const padding = parseInt($('padding').value, 10) || 0;
      const halign = $('halign').value;
      const valign = $('valign').value;
      const fg = $('fgHex').value;
      const weight = $('weight').value;
      const titleSize = parseInt($('titleSize').value, 10) || 84;
      const subSize = parseInt($('subSize').value, 10) || 32;
      const useShadow = $('shadow').checked;

      const innerX = padding;
      const innerY = padding;
      const innerW = w - padding * 2;
      const innerH = h - padding * 2;

      ctx.fillStyle = fg;
      ctx.textBaseline = 'top';
      if (useShadow) {
        ctx.shadowColor = 'rgba(0,0,0,0.35)';
        ctx.shadowBlur = Math.max(6, titleSize / 8);
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = Math.max(2, titleSize / 24);
      } else {
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
      }

      // Wrap title
      let titleLines = wrapText($('title').value, innerW, titleSize, weight);
      const maxTitleLines = 4;
      if (titleLines.length > maxTitleLines) {
        titleLines = titleLines.slice(0, maxTitleLines);
        titleLines[maxTitleLines - 1] = ellipsizeLine(titleLines[maxTitleLines - 1] + '…', innerW);
      }
      const titleLineHeight = titleSize * 1.25;
      const titleBlockH = titleLines.length * titleLineHeight;

      const subText = $('subtitle').value;
      const subLines = subText ? wrapText(subText, innerW, subSize, '500') : [];
      const subLineHeight = subSize * 1.4;
      const subBlockH = subLines.length * subLineHeight;
      const gap = subBlockH > 0 ? subSize * 0.6 : 0;

      const blockH = titleBlockH + gap + subBlockH;
      let blockY;
      if (valign === 'top') blockY = innerY;
      else if (valign === 'bottom') blockY = innerY + innerH - blockH;
      else blockY = innerY + (innerH - blockH) / 2;

      // Subtitle (drawn first as a label above title? Spec says sub below title)
      // We'll draw title first, then subtitle below.
      ctx.font = weight + ' ' + titleSize + 'px ' +
        '-apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif';
      const align = halign === 'left' ? 'left' : (halign === 'right' ? 'right' : 'center');
      ctx.textAlign = align;
      const x = halign === 'left' ? innerX : (halign === 'right' ? (innerX + innerW) : (innerX + innerW / 2));

      titleLines.forEach((line, i) => {
        ctx.fillText(line, x, blockY + i * titleLineHeight);
      });

      if (subLines.length > 0) {
        ctx.font = '500 ' + subSize + 'px ' +
          '-apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif';
        ctx.fillStyle = fg;
        ctx.globalAlpha = 0.86;
        subLines.forEach((line, i) => {
          ctx.fillText(line, x, blockY + titleBlockH + gap + i * subLineHeight);
        });
        ctx.globalAlpha = 1;
      }

      // Site name (small, bottom-right corner)
      const site = $('site').value.trim();
      if (site) {
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        const ss = Math.max(14, Math.round(subSize * 0.7));
        ctx.font = '500 ' + ss + 'px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif';
        ctx.textAlign = 'right';
        ctx.fillStyle = fg;
        ctx.globalAlpha = 0.7;
        ctx.fillText(site, w - padding, h - padding - ss);
        ctx.globalAlpha = 1;
      }

      // Reset shadow
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
    }

    function flashStatus(msg) {
      const el = $('status');
      el.textContent = msg;
      setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 1400);
    }

    function downloadAs(mime, ext) {
      const url = canvas.toDataURL(mime, 0.92);
      const a = document.createElement('a');
      a.href = url;
      const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      a.download = 'og-' + canvas.width + 'x' + canvas.height + '-' + stamp + '.' + ext;
      document.body.appendChild(a);
      a.click();
      a.remove();
      flashStatus('保存しました');
    }

    $('downloadPng').addEventListener('click', () => downloadAs('image/png', 'png'));
    $('downloadJpeg').addEventListener('click', () => downloadAs('image/jpeg', 'jpg'));
    $('copyImg').addEventListener('click', async () => {
      try {
        const blob = await new Promise((res) => canvas.toBlob(res, 'image/png'));
        if (!blob) { flashStatus('画像化に失敗しました'); return; }
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          flashStatus('コピーしました');
        } else {
          flashStatus('このブラウザは画像コピーに対応していません');
        }
      } catch (e) {
        flashStatus('コピーに失敗: ' + e.message);
      }
    });

    render();
  })();
</script>
</body>
</html>
