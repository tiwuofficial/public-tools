<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボウリングスコア計算 - public-tools</title>
<link rel="stylesheet" href="../_shared/style.css">
<style>
  .board { display: flex; gap: 4px; overflow-x: auto; padding: 8px 0; }
  .frame { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); min-width: 80px; display: flex; flex-direction: column; }
  .frame.f10 { min-width: 110px; }
  .frame-no { text-align: center; font-size: 0.8rem; color: var(--muted); padding: 4px; border-bottom: 1px solid var(--border); }
  .pins { display: grid; grid-template-columns: 1fr 1fr; }
  .frame.f10 .pins { grid-template-columns: 1fr 1fr 1fr; }
  .pin { border-right: 1px solid var(--border); text-align: center; padding: 4px; }
  .pin:last-child { border-right: none; }
  .pin input { width: 100%; border: none; background: transparent; text-align: center; font-size: 1rem; font-weight: 600; padding: 6px 0; }
  .pin input:focus { outline: 2px solid var(--accent); border-radius: 4px; }
  .cumul { text-align: center; padding: 10px 4px; font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .total { font-size: 2.4rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="container wide">
  <div class="nav"><a href="../../index.html">← ツール一覧へ戻る</a></div>
  <header class="page-header">
    <h1>ボウリングスコア計算</h1>
    <p class="lead">10 フレームのピン数を入力するとスコアを計算。ストライク/スペアも自動加点。</p>
  </header>

  <div class="card">
    <div class="board" id="board"></div>
    <div class="actions">
      <button class="primary" id="reset">リセット</button>
      <button id="perfect">パーフェクト (全ストライク)</button>
    </div>
    <div style="margin-top:8px; color: var(--muted); font-size: 0.85rem">入力: 0〜10 の数字。1投目に 10 と入力するとストライク (X) 、2投目に合計10だとスペア (/) になります。</div>
  </div>

  <h2>合計スコア</h2>
  <div class="card" style="text-align:center"><div class="total" id="total">0</div></div>
</div>
<script>
  const board = document.getElementById('board');
  let frames = [];
  for (let i = 0; i < 10; i++) {
    const div = document.createElement('div');
    div.className = 'frame' + (i === 9 ? ' f10' : '');
    const pinCount = i === 9 ? 3 : 2;
    let pinHtml = '';
    for (let p = 0; p < pinCount; p++) {
      pinHtml += `<div class="pin"><input data-frame="${i}" data-pin="${p}" maxlength="2"></div>`;
    }
    div.innerHTML = `<div class="frame-no">${i+1}</div><div class="pins">${pinHtml}</div><div class="cumul" data-cumul="${i}">-</div>`;
    board.appendChild(div);
    frames.push({ pins: Array(pinCount).fill('') });
  }

  function parsePin(s) {
    s = (s || '').toUpperCase().trim();
    if (s === '') return null;
    if (s === 'X') return 'X';
    if (s === '/') return '/';
    const n = parseInt(s, 10);
    if (isNaN(n) || n < 0 || n > 10) return null;
    return n;
  }
  function pinVal(v, prev) {
    if (v === 'X') return 10;
    if (v === '/') return 10 - (typeof prev === 'number' ? prev : 0);
    if (typeof v === 'number') return v;
    return null;
  }

  function calc() {
    const throws = [];
    for (let i = 0; i < 10; i++) {
      const f = frames[i];
      let prev = null;
      for (let p = 0; p < f.pins.length; p++) {
        const v = parsePin(f.pins[p]);
        const num = pinVal(v, prev);
        throws.push({ raw: v, num, frame: i, pin: p });
        prev = num;
      }
    }
    function thrAt(fi, pi) { return throws.find(t => t.frame === fi && t.pin === pi); }
    function nextNum(idx, n) {
      const r = [];
      for (let i = idx + 1; i < throws.length && r.length < n; i++) {
        if (throws[i].num != null) r.push(throws[i].num);
      }
      return r;
    }
    let cumul = 0;
    for (let i = 0; i < 10; i++) {
      const el = document.querySelector(`[data-cumul="${i}"]`);
      const t0 = thrAt(i, 0);
      const t1 = thrAt(i, 1);
      if (!t0 || t0.num == null) { el.textContent = '-'; continue; }
      if (i < 9) {
        if (t0.raw === 'X') {
          const idx = throws.indexOf(t0);
          const nxt = nextNum(idx, 2);
          if (nxt.length < 2) { el.textContent = '-'; continue; }
          cumul += 10 + nxt[0] + nxt[1];
        } else if (t1 && t1.raw === '/') {
          const idx = throws.indexOf(t1);
          const nxt = nextNum(idx, 1);
          if (nxt.length < 1) { el.textContent = '-'; continue; }
          cumul += 10 + nxt[0];
        } else if (t1 && t1.num != null) {
          cumul += t0.num + t1.num;
        } else { el.textContent = '-'; continue; }
      } else {
        const t2 = thrAt(i, 2);
        const strike = t0.raw === 'X';
        const spare = t1 && t1.raw === '/';
        if (strike || spare) {
          if (!t1 || t1.num == null || !t2 || t2.num == null) { el.textContent = '-'; continue; }
          cumul += t0.num + t1.num + t2.num;
        } else {
          if (!t1 || t1.num == null) { el.textContent = '-'; continue; }
          cumul += t0.num + t1.num;
        }
      }
      el.textContent = cumul;
    }
    document.getElementById('total').textContent = cumul;
  }

  function autoSpecial(fi, pi) {
    const f = frames[fi];
    if (fi < 9) {
      if (pi === 0 && parseInt(f.pins[0], 10) === 10) {
        f.pins[0] = 'X';
        document.querySelector(`input[data-frame="${fi}"][data-pin="0"]`).value = 'X';
        const next = document.querySelector(`input[data-frame="${fi+1}"][data-pin="0"]`);
        if (next) next.focus();
      } else if (pi === 1) {
        const a = parseInt(f.pins[0], 10);
        const b = parseInt(f.pins[1], 10);
        if (!isNaN(a) && !isNaN(b) && a + b === 10) {
          f.pins[1] = '/';
          document.querySelector(`input[data-frame="${fi}"][data-pin="1"]`).value = '/';
        }
      }
    }
  }

  document.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('input', () => {
      const fi = +inp.dataset.frame, pi = +inp.dataset.pin;
      const v = inp.value.toUpperCase();
      if (v === '' || v === 'X' || v === '/' || /^\d{1,2}$/.test(v)) {
        frames[fi].pins[pi] = v;
        autoSpecial(fi, pi);
        calc();
      } else {
        inp.value = frames[fi].pins[pi];
      }
    });
  });

  document.getElementById('reset').addEventListener('click', () => {
    frames.forEach(f => f.pins = f.pins.map(() => ''));
    document.querySelectorAll('input').forEach(i => i.value = '');
    calc();
  });
  document.getElementById('perfect').addEventListener('click', () => {
    for (let i = 0; i < 9; i++) { frames[i].pins = ['X', '']; }
    frames[9].pins = ['X', 'X', 'X'];
    for (let i = 0; i < 9; i++) {
      document.querySelector(`input[data-frame="${i}"][data-pin="0"]`).value = 'X';
      document.querySelector(`input[data-frame="${i}"][data-pin="1"]`).value = '';
    }
    for (let p = 0; p < 3; p++) {
      document.querySelector(`input[data-frame="9"][data-pin="${p}"]`).value = 'X';
    }
    calc();
  });

  calc();
</script>
</body>
</html>
