<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ローマ字練習 - public-tools</title>
<link rel="stylesheet" href="../_shared/style.css">
<style>
  .opts { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 8px 0; }
  .opts label { color: var(--muted); font-size: 0.9rem; }
  .question { font-size: 4rem; font-weight: 600; text-align: center; margin: 24px 0 12px; font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; }
  .answer-input { font-size: 2rem; text-align: center; max-width: 240px; margin: 0 auto; display: block; }
  .judge { text-align: center; min-height: 1.6em; font-size: 1.3rem; font-weight: 600; margin: 12px 0; }
  .judge.ok { color: #16a34a; }
  .judge.ng { color: var(--danger); }
  .toggle { display: inline-flex; gap: 4px; border: 1px solid var(--border); border-radius: var(--radius); padding: 2px; }
  .toggle button { border: none; background: transparent; padding: 6px 12px; border-radius: 4px; }
  .toggle button.active { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<div class="container">
  <div class="nav"><a href="../../index.html">← ツール一覧へ戻る</a></div>
  <header class="page-header">
    <h1>ローマ字練習</h1>
    <p class="lead">ひらがな ⇔ ローマ字の変換ドリル。タイピング入門にも。</p>
  </header>

  <div class="card">
    <div class="opts">
      <label>方向:</label>
      <div class="toggle" id="dir">
        <button data-dir="h2r" class="active">ひらがな → ローマ字</button>
        <button data-dir="r2h">ローマ字 → ひらがな</button>
      </div>
    </div>
    <div class="opts">
      <label>出題範囲:</label>
      <div class="toggle" id="range">
        <button data-range="basic" class="active">五十音</button>
        <button data-range="dakuten">+濁音/半濁音</button>
        <button data-range="youon">+拗音(きゃ等)</button>
      </div>
    </div>
    <div class="opts">
      <label>方式:</label>
      <div class="toggle" id="style">
        <button data-style="hepburn" class="active">ヘボン式</button>
        <button data-style="kunrei">訓令式</button>
      </div>
    </div>
    <div class="actions"><button class="primary" id="start">開始 / 次の問題</button></div>
  </div>

  <div class="question" id="q">-</div>
  <input type="text" class="answer-input" id="ans" placeholder="こたえ" autocomplete="off">
  <div class="judge" id="judge"></div>
  <div class="actions" style="justify-content:center">
    <button id="reveal">答えを表示</button>
  </div>

  <div class="stats" style="margin-top:20px">
    <div class="stat"><div class="label">問題</div><div class="value" id="s-q">0</div></div>
    <div class="stat"><div class="label">正解</div><div class="value" id="s-ok">0</div></div>
    <div class="stat"><div class="label">連続</div><div class="value" id="s-streak">0</div></div>
  </div>
</div>
<script>
  const basic = {
    'あ':'a','い':'i','う':'u','え':'e','お':'o',
    'か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
    'さ':'sa','し':['shi','si'],'す':'su','せ':'se','そ':'so',
    'た':'ta','ち':['chi','ti'],'つ':['tsu','tu'],'て':'te','と':'to',
    'な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no',
    'は':'ha','ひ':'hi','ふ':['fu','hu'],'へ':'he','ほ':'ho',
    'ま':'ma','み':'mi','む':'mu','め':'me','も':'mo',
    'や':'ya','ゆ':'yu','よ':'yo',
    'ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro',
    'わ':'wa','を':'wo','ん':'n'
  };
  const dakuten = {
    'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go',
    'ざ':'za','じ':['ji','zi'],'ず':'zu','ぜ':'ze','ぞ':'zo',
    'だ':'da','ぢ':['ji','di'],'づ':['zu','du'],'で':'de','ど':'do',
    'ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
    'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po'
  };
  const youon = {
    'きゃ':'kya','きゅ':'kyu','きょ':'kyo',
    'しゃ':['sha','sya'],'しゅ':['shu','syu'],'しょ':['sho','syo'],
    'ちゃ':['cha','tya'],'ちゅ':['chu','tyu'],'ちょ':['cho','tyo'],
    'にゃ':'nya','にゅ':'nyu','にょ':'nyo',
    'ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo',
    'みゃ':'mya','みゅ':'myu','みょ':'myo',
    'りゃ':'rya','りゅ':'ryu','りょ':'ryo',
    'ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo',
    'じゃ':['ja','zya'],'じゅ':['ju','zyu'],'じょ':['jo','zyo'],
    'びゃ':'bya','びゅ':'byu','びょ':'byo',
    'ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo'
  };

  function pickStyle(v, style) {
    if (Array.isArray(v)) return style === 'kunrei' ? v[1] : v[0];
    return v;
  }
  function buildPool(range, style) {
    let dict = { ...basic };
    if (range === 'dakuten' || range === 'youon') Object.assign(dict, dakuten);
    if (range === 'youon') Object.assign(dict, youon);
    const list = [];
    for (const k in dict) list.push({ hiragana: k, romaji: pickStyle(dict[k], style), alts: Array.isArray(dict[k]) ? dict[k] : [dict[k]] });
    return list;
  }

  let dir = 'h2r', range = 'basic', style = 'hepburn';
  let cur = null, qCount = 0, okCount = 0, streak = 0;

  function setupToggle(id, cb) {
    document.querySelectorAll(`#${id} button`).forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll(`#${id} button`).forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        cb(b.dataset[Object.keys(b.dataset)[0]]);
      });
    });
  }
  setupToggle('dir', v => { dir = v; });
  setupToggle('range', v => { range = v; });
  setupToggle('style', v => { style = v; });

  function newQuestion() {
    const pool = buildPool(range, style);
    cur = pool[Math.floor(Math.random() * pool.length)];
    document.getElementById('q').textContent = dir === 'h2r' ? cur.hiragana : pickStyle(cur.alts, style);
    document.getElementById('ans').value = '';
    document.getElementById('judge').textContent = '';
    document.getElementById('judge').className = 'judge';
    document.getElementById('ans').focus();
  }

  function judge() {
    if (!cur) return;
    const v = document.getElementById('ans').value.trim().toLowerCase();
    if (!v) return;
    qCount++;
    let correct;
    if (dir === 'h2r') {
      correct = cur.alts.some(r => r === v);
    } else {
      correct = v === cur.hiragana;
    }
    const j = document.getElementById('judge');
    if (correct) {
      okCount++; streak++;
      j.textContent = '○ せいかい！';
      j.className = 'judge ok';
      setTimeout(newQuestion, 500);
    } else {
      streak = 0;
      const ans = dir === 'h2r' ? cur.alts.join(' / ') : cur.hiragana;
      j.textContent = `× ざんねん。 正解は ${ans}`;
      j.className = 'judge ng';
    }
    updateStats();
  }

  function updateStats() {
    document.getElementById('s-q').textContent = qCount;
    document.getElementById('s-ok').textContent = okCount;
    document.getElementById('s-streak').textContent = streak;
  }

  document.getElementById('start').addEventListener('click', newQuestion);
  document.getElementById('reveal').addEventListener('click', () => {
    if (!cur) return;
    const ans = dir === 'h2r' ? cur.alts.join(' / ') : cur.hiragana;
    const j = document.getElementById('judge');
    j.textContent = '答え: ' + ans;
    j.className = 'judge';
  });
  document.getElementById('ans').addEventListener('keydown', e => { if (e.key === 'Enter') judge(); });
  newQuestion();
</script>
</body>
</html>
