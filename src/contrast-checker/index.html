<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カラーコントラストチェッカー - public-tools</title>
<link rel="stylesheet" href="../_shared/style.css">
</head>
<body>
<div class="container">
  <div class="nav"><a href="../../index.html">← ツール一覧へ戻る</a></div>
  <header class="page-header">
    <h1>カラーコントラストチェッカー</h1>
    <p class="lead">文字色と背景色のコントラスト比を計算し、WCAG の達成基準を判定します。</p>
  </header>

  <div class="split-2">
    <div class="pane">
      <span class="pane-label">文字色</span>
      <div class="form-row" style="margin-top:0">
        <input type="color" id="fg-color" value="#1f2328" style="width:48px;height:40px;padding:2px">
        <input type="text" id="fg-hex" value="#1f2328" style="max-width:140px">
      </div>
    </div>
    <div class="pane">
      <span class="pane-label">背景色</span>
      <div class="form-row" style="margin-top:0">
        <input type="color" id="bg-color" value="#ffffff" style="width:48px;height:40px;padding:2px">
        <input type="text" id="bg-hex" value="#ffffff" style="max-width:140px">
      </div>
    </div>
  </div>
  <div class="actions">
    <button id="swap" type="button">文字色 ⇄ 背景色 を入れ替え</button>
  </div>
  <div id="hex-error"></div>

  <div id="preview" style="margin-top:16px;border:1px solid var(--border);border-radius:var(--radius);padding:24px">
    <div id="preview-large" style="font-size:1.8rem;font-weight:700;margin-bottom:8px">大きな文字 Aa 24px Bold</div>
    <div id="preview-small">通常の文字サイズのサンプルテキストです。Sample text 16px。</div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="label">コントラスト比</div>
      <div class="value" id="ratio">-</div>
    </div>
  </div>

  <h2>WCAG 2.1 判定</h2>
  <ul id="judgements" class="plain-list"></ul>

  <footer class="page-footer">
    判定基準は WCAG 2.1。大きな文字＝18pt(24px) 以上、または 14pt(18.66px) 以上の太字。
  </footer>
</div>

<script>
  const $ = id => document.getElementById(id);

  const CRITERIA = [
    { label: "通常文字 AA（4.5:1）", min: 4.5 },
    { label: "通常文字 AAA（7:1）", min: 7 },
    { label: "大きな文字 AA（3:1）", min: 3 },
    { label: "大きな文字 AAA（4.5:1）", min: 4.5 },
    { label: "UI 部品・グラフィック（3:1）", min: 3 }
  ];

  function parseHex(str) {
    let s = (str || "").trim().replace(/^#/, "");
    if (s.length === 3) s = s.split("").map(c => c + c).join("");
    if (!/^[0-9a-fA-F]{6}$/.test(s)) return null;
    return {
      r: parseInt(s.slice(0, 2), 16),
      g: parseInt(s.slice(2, 4), 16),
      b: parseInt(s.slice(4, 6), 16),
      hex: "#" + s.toLowerCase()
    };
  }

  function relLum({ r, g, b }) {
    const f = v => {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    };
    return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
  }

  function contrast(c1, c2) {
    const l1 = relLum(c1), l2 = relLum(c2);
    const hi = Math.max(l1, l2), lo = Math.min(l1, l2);
    return (hi + 0.05) / (lo + 0.05);
  }

  function update() {
    const fg = parseHex($("fg-hex").value);
    const bg = parseHex($("bg-hex").value);
    if (!fg || !bg) {
      $("hex-error").innerHTML = '<div class="banner error">HEX を #RRGGBB 形式で入力してください。</div>';
      return;
    }
    $("hex-error").innerHTML = "";
    // カラーピッカーと同期
    $("fg-color").value = fg.hex;
    $("bg-color").value = bg.hex;

    const ratio = contrast(fg, bg);
    $("ratio").textContent = ratio.toFixed(2) + " : 1";

    const prev = $("preview");
    prev.style.color = fg.hex;
    prev.style.background = bg.hex;

    const ul = $("judgements");
    ul.innerHTML = "";
    CRITERIA.forEach(c => {
      const pass = ratio >= c.min;
      const li = document.createElement("li");
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = c.label;
      const val = document.createElement("span");
      val.textContent = pass ? "✓ 合格" : "✕ 不合格";
      val.style.fontWeight = "600";
      val.style.color = pass ? "var(--added-fg)" : "var(--danger)";
      li.appendChild(label);
      li.appendChild(val);
      ul.appendChild(li);
    });
  }

  function syncFromPicker(pickerId, hexId) {
    $(hexId).value = $(pickerId).value;
    update();
  }

  $("fg-hex").addEventListener("input", update);
  $("bg-hex").addEventListener("input", update);
  $("fg-color").addEventListener("input", () => syncFromPicker("fg-color", "fg-hex"));
  $("bg-color").addEventListener("input", () => syncFromPicker("bg-color", "bg-hex"));
  $("swap").addEventListener("click", () => {
    const a = $("fg-hex").value;
    $("fg-hex").value = $("bg-hex").value;
    $("bg-hex").value = a;
    update();
  });

  update();
</script>
</body>
</html>
