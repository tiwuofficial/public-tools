<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>施肥量計算（N-P-K） - public-tools</title>
<link rel="stylesheet" href="../_shared/style.css">
</head>
<body>
<div class="container">
  <div class="nav"><a href="../../index.html">← ツール一覧へ戻る</a></div>
  <header class="page-header">
    <h1>施肥量計算（N-P-K）</h1>
    <p class="lead">化成肥料の成分と圃場面積から、必要な肥料量・袋数・投入される N/P/K を概算します。</p>
  </header>

  <div class="card">
    <div class="form-row">
      <label>圃場面積（a）</label>
      <input type="number" id="area" min="0" step="0.1" value="10">
      <span class="muted">1a = 100m²、10a = 1反</span>
    </div>
    <div class="form-row">
      <label>肥料の成分（%）　N</label>
      <input type="number" id="n" min="0" max="100" step="0.1" value="8">
      <label>P₂O₅</label>
      <input type="number" id="p" min="0" max="100" step="0.1" value="8">
      <label>K₂O</label>
      <input type="number" id="k" min="0" max="100" step="0.1" value="8">
    </div>
    <div class="form-row">
      <label>目標 窒素(N) 施肥量（kg/10a）</label>
      <input type="number" id="target" min="0" step="0.1" value="10">
    </div>
    <div class="form-row">
      <label>1袋の重量（kg）</label>
      <input type="number" id="bag" min="0.1" step="0.1" value="20">
    </div>
  </div>

  <h2>結果</h2>
  <div class="stats" id="stats">
    <div class="stat"><div class="label">必要な肥料の総量</div><div class="value" id="r-fert">-</div></div>
    <div class="stat"><div class="label">袋数（切り上げ）</div><div class="value" id="r-bags">-</div></div>
    <div class="stat"><div class="label">投入される N</div><div class="value" id="r-n">-</div></div>
    <div class="stat"><div class="label">投入される P₂O₅</div><div class="value" id="r-p">-</div></div>
    <div class="stat"><div class="label">投入される K₂O</div><div class="value" id="r-k">-</div></div>
  </div>
  <p class="muted" id="note" style="margin-top:12px"></p>
</div>
<script>
  const $ = id => document.getElementById(id);
  const ids = ['area', 'n', 'p', 'k', 'target', 'bag'];
  ids.forEach(id => { $(id).addEventListener('input', recalc); });

  function kg(v) {
    if (!isFinite(v)) return '-';
    return (Math.round(v * 10) / 10).toLocaleString() + ' kg';
  }

  function recalc() {
    const area = parseFloat($('area').value) || 0;       // a
    const npct = parseFloat($('n').value) || 0;          // %
    const ppct = parseFloat($('p').value) || 0;
    const kpct = parseFloat($('k').value) || 0;
    const target = parseFloat($('target').value) || 0;   // kg/10a (N basis)
    const bag = parseFloat($('bag').value) || 0;         // kg/袋

    const units10a = area / 10;                          // 10a 単位の数
    const needN = target * units10a;                     // 必要な N 総量(kg)

    if (npct <= 0 || area <= 0) {
      ['r-fert', 'r-bags', 'r-n', 'r-p', 'r-k'].forEach(i => $(i).textContent = '-');
      $('note').textContent = npct <= 0
        ? '肥料の窒素(N)成分が 0% では窒素基準で算出できません。'
        : '圃場面積を入力してください。';
      return;
    }

    const fertKg = needN / (npct / 100);                 // 必要肥料量(kg)
    const bags = bag > 0 ? Math.ceil(fertKg / bag) : NaN;
    const appliedN = fertKg * npct / 100;
    const appliedP = fertKg * ppct / 100;
    const appliedK = fertKg * kpct / 100;

    $('r-fert').textContent = kg(fertKg);
    $('r-bags').textContent = isFinite(bags) ? bags.toLocaleString() + ' 袋' : '-';
    $('r-n').textContent = kg(appliedN);
    $('r-p').textContent = kg(appliedP);
    $('r-k').textContent = kg(appliedK);
    $('note').textContent =
      `窒素(N)基準で算出。この肥料 ${kg(fertKg)} を ${area.toLocaleString()}a に施用すると、` +
      `P₂O₅ ${kg(appliedP)}・K₂O ${kg(appliedK)} が同時に投入されます。`;
  }

  recalc();
</script>
</body>
</html>
