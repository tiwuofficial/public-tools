<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ローン返済計算 - public-tools</title>
<link rel="stylesheet" href="../_shared/style.css">
</head>
<body>
<div class="container">
  <div class="nav"><a href="../../index.html">← ツール一覧へ戻る</a></div>
  <header class="page-header">
    <h1>ローン返済計算</h1>
    <p class="lead">借入額・年利・期間から毎月の返済額・総返済額・利息を試算します。住宅・車ローンの検討に。</p>
  </header>

  <div class="form-row">
    <label for="principal">借入額（円）</label>
    <input type="number" id="principal" min="0" step="10000" value="30000000">
  </div>
  <div class="form-row">
    <label for="rate">年利（％）</label>
    <input type="number" id="rate" min="0" max="30" step="0.01" value="1.5">
    <label for="years">返済期間（年）</label>
    <input type="number" id="years" min="1" max="50" value="35">
    <label for="method">返済方式</label>
    <select id="method">
      <option value="equal-payment">元利均等返済</option>
      <option value="equal-principal">元金均等返済</option>
    </select>
  </div>

  <div class="actions">
    <button id="calc" class="primary" type="button">計算する</button>
  </div>
  <div id="banner-area"></div>

  <div id="result" hidden>
    <div class="stats">
      <div class="stat"><div class="label" id="pay-label">毎月返済額</div><div class="value" id="monthly">¥0</div></div>
      <div class="stat"><div class="label">総返済額</div><div class="value" id="total">¥0</div></div>
      <div class="stat"><div class="label">利息合計</div><div class="value" id="interest">¥0</div></div>
    </div>
    <h2>年ごとの返済予定</h2>
    <ul id="schedule" class="plain-list"></ul>
  </div>

  <footer class="page-footer">
    概算値です（円未満は四捨五入）。実際の返済額は金融機関の計算方法・手数料等により異なります。
  </footer>
</div>

<script>
  const $ = id => document.getElementById(id);
  const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");

  function showError(msg) {
    $("banner-area").innerHTML = '<div class="banner error">' + msg + "</div>";
    $("result").hidden = true;
  }

  function calc() {
    const principal = parseFloat($("principal").value);
    const annual = parseFloat($("rate").value);
    const years = parseInt($("years").value, 10);
    const method = $("method").value;

    if (!Number.isFinite(principal) || principal <= 0) return showError("借入額を入力してください。");
    if (!Number.isFinite(annual) || annual < 0) return showError("年利を正しく入力してください。");
    if (!Number.isFinite(years) || years < 1) return showError("返済期間を入力してください。");

    $("banner-area").innerHTML = "";
    const n = years * 12;          // 総返済回数
    const r = annual / 100 / 12;   // 月利

    // 各月の {principal, interest, balance} を計算
    const rows = [];
    let balance = principal;
    let totalPay = 0;

    if (method === "equal-payment") {
      // 元利均等
      const monthly = r === 0 ? principal / n : principal * r / (1 - Math.pow(1 + r, -n));
      for (let i = 0; i < n; i++) {
        const interest = balance * r;
        let principalPart = monthly - interest;
        if (i === n - 1) principalPart = balance; // 端数調整
        balance -= principalPart;
        if (balance < 0) balance = 0;
        rows.push({ principal: principalPart, interest: interest, balance: balance });
        totalPay += principalPart + interest;
      }
      $("pay-label").textContent = "毎月返済額";
      $("monthly").textContent = yen(monthly);
    } else {
      // 元金均等
      const principalPart = principal / n;
      for (let i = 0; i < n; i++) {
        const interest = balance * r;
        let pp = principalPart;
        if (i === n - 1) pp = balance;
        balance -= pp;
        if (balance < 0) balance = 0;
        rows.push({ principal: pp, interest: interest, balance: balance });
        totalPay += pp + interest;
      }
      const first = rows[0].principal + rows[0].interest;
      const last = rows[n - 1].principal + rows[n - 1].interest;
      $("pay-label").textContent = "毎月返済額（初回→最終）";
      $("monthly").textContent = yen(first) + " → " + yen(last);
    }

    $("total").textContent = yen(totalPay);
    $("interest").textContent = yen(totalPay - principal);

    // 年ごとに集計
    const ul = $("schedule");
    ul.innerHTML = "";
    for (let y = 0; y < years; y++) {
      let pSum = 0, iSum = 0;
      for (let m = 0; m < 12; m++) {
        const row = rows[y * 12 + m];
        if (!row) break;
        pSum += row.principal;
        iSum += row.interest;
      }
      const endBalance = rows[Math.min((y + 1) * 12, n) - 1].balance;
      const li = document.createElement("li");
      const label = document.createElement("span");
      label.className = "label";
      label.textContent = (y + 1) + "年目";
      const val = document.createElement("span");
      val.textContent = "元金 " + yen(pSum) + " / 利息 " + yen(iSum) + " / 残高 " + yen(endBalance);
      li.appendChild(label);
      li.appendChild(val);
      ul.appendChild(li);
    }

    $("result").hidden = false;
  }

  $("calc").addEventListener("click", calc);
  ["principal", "rate", "years", "method"].forEach(id => {
    $(id).addEventListener("change", calc);
  });

  calc();
</script>
</body>
</html>
