<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>あみだくじ - public-tools</title>
<link rel="stylesheet" href="../_shared/style.css">
<style>
  .amida-wrap { overflow: auto; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-top: 16px; }
  .amida-wrap svg { display: block; }
  .amida-wrap .name, .amida-wrap .prize { font-size: 13px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
  .amida-wrap .path { stroke: var(--accent); stroke-width: 3; fill: none; opacity: 0; transition: opacity 0.2s; }
  .amida-wrap .path.show { opacity: 1; }
  table.result { border-collapse: collapse; margin-top: 16px; width: 100%; }
  table.result th, table.result td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
  table.result th { background: var(--bg); }
  .density { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
</style>
</head>
<body>
<div class="container wide">
  <div class="nav"><a href="../../index.html">← ツール一覧へ戻る</a></div>
  <header class="page-header">
    <h1>あみだくじ</h1>
    <p class="lead">参加者と当たりを入力して、ブラウザでランダムなあみだくじを引く。</p>
  </header>

  <div class="split-2">
    <div class="pane">
      <div class="pane-label">参加者（1 行に 1 人）</div>
      <textarea id="names" placeholder="たろう&#10;はなこ&#10;じろう&#10;さちこ"></textarea>
    </div>
    <div class="pane">
      <div class="pane-label">当たり / 結果（1 行に 1 つ）</div>
      <textarea id="prizes" placeholder="あたり&#10;はずれ&#10;はずれ&#10;はずれ"></textarea>
    </div>
  </div>

  <div class="density">
    <label>横線の密度:</label>
    <select id="density" style="width:auto">
      <option value="1.0">普通</option>
      <option value="0.6">少なめ</option>
      <option value="1.6">多め</option>
    </select>
  </div>

  <div class="actions">
    <button class="primary" id="draw">あみだを引く</button>
    <button id="reveal">全員の道筋を表示</button>
    <button id="clear">クリア</button>
  </div>

  <div id="banner"></div>

  <div class="amida-wrap" id="wrap" style="display:none">
    <svg id="svg"></svg>
  </div>

  <div id="result"></div>
</div>
<script>
  const namesEl = document.getElementById('names');
  const prizesEl = document.getElementById('prizes');
  const densityEl = document.getElementById('density');
  const svg = document.getElementById('svg');
  const wrap = document.getElementById('wrap');
  const banner = document.getElementById('banner');
  const result = document.getElementById('result');

  const COL_W = 80;
  const ROW_H = 22;
  const TOP_PAD = 36;
  const BOTTOM_PAD = 36;

  function parseLines(s) {
    return s.split(/\r?\n/).map(x => x.trim()).filter(x => x.length > 0);
  }

  function showError(msg) {
    banner.innerHTML = msg ? `<div class="banner error">${msg}</div>` : '';
  }

  function draw() {
    showError('');
    result.innerHTML = '';
    const names = parseLines(namesEl.value);
    let prizes = parseLines(prizesEl.value);
    if (names.length < 2) {
      showError('参加者を 2 人以上入力してください。');
      wrap.style.display = 'none';
      return;
    }
    while (prizes.length < names.length) prizes.push('はずれ');
    if (prizes.length > names.length) prizes = prizes.slice(0, names.length);

    const n = names.length;
    const density = parseFloat(densityEl.value);
    const rowCount = Math.max(8, Math.floor(n * 4 * density));

    // 横線生成: 同じ行で隣接列に2本入らないようにする
    const bars = []; // {row, col} col は col と col+1 を結ぶ
    for (let r = 1; r < rowCount - 1; r++) {
      const used = new Set();
      const candidates = [];
      for (let c = 0; c < n - 1; c++) candidates.push(c);
      // ランダム順に試す
      for (let i = candidates.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
      }
      for (const c of candidates) {
        if (used.has(c) || used.has(c - 1) || used.has(c + 1)) continue;
        // この行ごとに 40% 程度の確率で横線
        if (Math.random() < 0.4 * density) {
          bars.push({ row: r, col: c });
          used.add(c);
        }
      }
    }

    // 結果計算
    const mapping = []; // mapping[i] = 列 i から開始して最終的に到達する列
    for (let i = 0; i < n; i++) {
      let col = i;
      for (let r = 0; r < rowCount; r++) {
        const left = bars.find(b => b.row === r && b.col === col);
        const right = bars.find(b => b.row === r && b.col === col - 1);
        if (left) col = col + 1;
        else if (right) col = col - 1;
      }
      mapping.push(col);
    }

    // SVG 描画
    const width = (n - 1) * COL_W + 80;
    const height = TOP_PAD + rowCount * ROW_H + BOTTOM_PAD;
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    let html = '';
    // 名前
    for (let i = 0; i < n; i++) {
      const x = 40 + i * COL_W;
      html += `<text class="name" x="${x}" y="20" text-anchor="middle">${escapeHtml(names[i])}</text>`;
    }
    // 当たり
    for (let i = 0; i < n; i++) {
      const x = 40 + i * COL_W;
      const y = height - 14;
      html += `<text class="prize" x="${x}" y="${y}" text-anchor="middle">${escapeHtml(prizes[i])}</text>`;
    }
    // 縦線
    for (let i = 0; i < n; i++) {
      const x = 40 + i * COL_W;
      html += `<line x1="${x}" y1="${TOP_PAD}" x2="${x}" y2="${TOP_PAD + rowCount * ROW_H}" stroke="#374151" stroke-width="2"/>`;
    }
    // 横線
    for (const b of bars) {
      const x1 = 40 + b.col * COL_W;
      const x2 = 40 + (b.col + 1) * COL_W;
      const y = TOP_PAD + b.row * ROW_H;
      html += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#374151" stroke-width="2"/>`;
    }
    // 各参加者の経路(初期は非表示)
    for (let i = 0; i < n; i++) {
      const pts = computePath(i, bars, rowCount, COL_W);
      html += `<polyline class="path" id="path-${i}" points="${pts}" stroke="${pickColor(i)}"/>`;
    }
    svg.innerHTML = html;
    wrap.style.display = '';

    // 結果テーブル
    let table = '<table class="result"><thead><tr><th>参加者</th><th>結果</th></tr></thead><tbody>';
    for (let i = 0; i < n; i++) {
      table += `<tr><td>${escapeHtml(names[i])}</td><td><button class="show-one" data-idx="${i}">${escapeHtml(prizes[mapping[i]])}</button></td></tr>`;
    }
    table += '</tbody></table><div style="margin-top:8px;color:var(--muted);font-size:0.85rem">結果ボタンを押すとその人の道筋を表示します。</div>';
    result.innerHTML = table;
    result.querySelectorAll('.show-one').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = parseInt(btn.dataset.idx, 10);
        const el = document.getElementById('path-' + idx);
        el.classList.toggle('show');
      });
    });
  }

  function computePath(startCol, bars, rowCount, colW) {
    const pts = [];
    const xOf = c => 40 + c * colW;
    let col = startCol;
    pts.push(`${xOf(col)},${TOP_PAD}`);
    for (let r = 0; r < rowCount; r++) {
      const y = TOP_PAD + r * ROW_H;
      pts.push(`${xOf(col)},${y}`);
      const left = bars.find(b => b.row === r && b.col === col);
      const right = bars.find(b => b.row === r && b.col === col - 1);
      if (left) {
        col = col + 1;
        pts.push(`${xOf(col)},${y}`);
      } else if (right) {
        col = col - 1;
        pts.push(`${xOf(col)},${y}`);
      }
    }
    pts.push(`${xOf(col)},${TOP_PAD + rowCount * ROW_H}`);
    return pts.join(' ');
  }

  function pickColor(i) {
    const palette = ['#dc2626','#2563eb','#16a34a','#d97706','#7c3aed','#db2777','#0891b2','#65a30d'];
    return palette[i % palette.length];
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  document.getElementById('draw').addEventListener('click', draw);
  document.getElementById('reveal').addEventListener('click', () => {
    document.querySelectorAll('.path').forEach(p => p.classList.add('show'));
  });
  document.getElementById('clear').addEventListener('click', () => {
    namesEl.value = '';
    prizesEl.value = '';
    wrap.style.display = 'none';
    result.innerHTML = '';
    showError('');
  });
</script>
</body>
</html>
